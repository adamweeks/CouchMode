<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071f20"/>
      <stop offset="100%" stop-color="#040e10"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071e20"/>
      <stop offset="100%" stop-color="#020a0b"/>
    </linearGradient>
    <linearGradient id="bezel-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bezel-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#2dd4bf" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#tv-bg)"/>
  <!-- TV body (bright teal bezel) -->
  <rect x="72" y="128" width="368" height="252" rx="28" fill="url(#bezel-grad)" filter="url(#bezel-shadow)"/>
  <!-- Screen inset -->
  <rect x="96" y="152" width="320" height="204" rx="12" fill="url(#screen-grad)"/>
  <!-- Screen subtle border -->
  <rect x="96" y="152" width="320" height="204" rx="12" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.4"/>
  <!-- Stand neck -->
  <rect x="216" y="378" width="80" height="22" rx="6" fill="#0f766e"/>
  <!-- Stand base -->
  <rect x="176" y="397" width="160" height="16" rx="8" fill="#0f766e"/>
  <!-- Rewatch circle (dim track) -->
  <circle cx="256" cy="254" r="68" fill="none" stroke="#134e4a" stroke-width="12"/>
  <!-- Rewatch arc (bright) -->
  <path d="M 256 186 A 68 68 0 1 1 200 289" fill="none" stroke="#ccfbf1" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow head -->
  <polygon points="190,277 198,299 215,284" fill="#ccfbf1" filter="url(#glow)"/>
  <!-- Play triangle -->
  <polygon points="240,233 240,275 278,254" fill="white" opacity="0.95" filter="url(#glow)"/>
  <!-- Subtle glow under stand -->
  <ellipse cx="256" cy="415" rx="100" ry="10" fill="#2dd4bf" opacity="0.2"/>
</svg>
