# XcodeGen spec for the native CouchMode iOS app.
# Generate the Xcode project with:  cd ios && xcodegen generate
name: CouchMode

options:
  bundleIdPrefix: com.couchmode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  CouchModeKit:
    path: CouchModeKit

targets:
  CouchMode:
    type: application
    platform: iOS
    sources:
      - path: CouchMode
    dependencies:
      - package: CouchModeKit
        product: CouchModeCore
      - package: CouchModeKit
        product: CouchModeData
    entitlements:
      path: CouchMode/CouchMode.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: CouchMode/Info.plist
      properties:
        CFBundleDisplayName: CouchMode
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: auth-callback
            CFBundleURLSchemes:
              - $(AUTH_URL_SCHEME)
        # Read at runtime by BackendConfig.fromBundle()
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        AUTH_REDIRECT_URL: $(AUTH_REDIRECT_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  CouchMode:
    build:
      targets:
        CouchMode: all
    run:
      config: Debug
    archive:
      config: Release
